<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter depuis la semaine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0066CC;text-decoration:none}a:hover{color:#004C99}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.press{transition:transform 120ms ease-out}.press:active{transform:scale(.96)}
.seg{transition:background-color 180ms ease-out,box-shadow 180ms ease-out}
.t-title{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:25px}
.t-body{font-size:17px;font-weight:400;line-height:22px}
.t-strong{font-size:17px;font-weight:600;line-height:22px}
.t-sub{font-size:15px;font-weight:400;line-height:20px;color:rgba(10,10,12,.6)}
.t-cap{font-size:13px;font-weight:500;line-height:18px;color:rgba(10,10,12,.6)}
:focus-visible{outline:2px solid #0A7CFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.press:active{transform:none}.seg{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #0A0A0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="position: absolute; inset: 0; transform: scale(.94) translateY(-10px); transform-origin: top center; border-radius: 40px; overflow: hidden">
    <dc-import name="Semaine" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 232px; box-sizing: border-box; padding: 8px 16px 32px; border-radius: 36px 36px 0 0; background: #F2F2F7; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -8px 30px rgba(0,0,0,.12)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(10,10,12,.2)"></span>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <button type="button" class="t-body" style="justify-self: start; min-height: 44px; padding: 0; border: none; background: transparent; color: #0066CC">Annuler</button>
      <h1 id="sheet-title" class="t-strong" style="margin: 0">Ajouter</h1>
      <span></span>
    </div>

    <div role="tablist" aria-label="Type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 22px; background: rgba(118,118,128,.14)">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" class="seg" onClick="{{t.pick}}" aria-selected="{{t.sel}}" style="min-height: 40px; border: none; border-radius: 18px; background: {{t.bg}}; box-shadow: {{t.shadow}}; font-size: 15px; font-weight: {{t.weight}}; color: #0A0A0C">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 class="t-cap" style="margin: 0; padding: 0 16px">Tes séances de muscu</h2>
      <div style="background: #FFFFFF; border-radius: 16px">
        <sc-for list="{{sessions}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding-left: 16px">
            <span style="width: 32px; height: 32px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; background: #EDEDF0; color: #3A3A3F">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"></path></svg>
            </span>
            <a href="Muscu.dc.html" style="flex: 1; min-height: 60px; display: flex; align-items: center; gap: 8px; padding-right: 8px; border-bottom: {{s.sep}}; color: #0A0A0C">
              <span style="flex: 1; display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 8px"><span class="t-body">{{s.name}}</span><sc-if value="{{s.legs}}" hint-placeholder-val="{{ false }}"><span class="t-cap" style="padding: 2px 8px; border-radius: 8px; background: #EDEDF0; color: #3A3A3F">Jambes</span></sc-if></span>
                <span class="t-cap">{{s.when}}</span>
              </span>
              <span class="t-strong" style="min-height: 44px; display: flex; align-items: center; padding: 0 8px; color: #0066CC">Placer</span>
            </a>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px">
      <a href="Muscu.dc.html" class="t-body" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; color: #0066CC">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Nouvelle séance de muscu
      </a>
    </div>

    <p class="t-cap" style="margin: 0; padding: 0 16px">Tu la places où tu veux dans la semaine. Reggie organise tes courses autour, avec 24 h d'écart après une séance jambes.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'Muscu' };
  }
  renderVals() {
    const cur = this.state.type;
    return {
      types: ['Muscu', 'Révision', 'Indispo'].map((label) => {
        const on = cur === label;
        return { label: label, sel: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', shadow: on ? '0 3px 8px rgba(0,0,0,.12)' : 'none', weight: on ? 600 : 400, pick: () => this.setState({ type: label }) };
      }),
      sessions: [
        { name: 'Haut du corps', when: 'Lundi 20:00 · chaque semaine', legs: false, sep: '.5px solid rgba(10,10,12,.1)' },
        { name: 'Jambes', when: 'Jeudi 19:30 · chaque semaine', legs: true, sep: '.5px solid rgba(10,10,12,.1)' },
        { name: 'Full body', when: 'Pas placée cette semaine', legs: true, sep: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
