<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pas dispo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0066CC;text-decoration:none}a:hover{color:#004C99}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.press{transition:transform 120ms ease-out}.press:active{transform:scale(.97)}
.opt{transition:box-shadow 180ms ease-out,background-color 180ms ease-out}
.seg{transition:background-color 180ms ease-out,box-shadow 180ms ease-out}
.t-body{font-size:17px;font-weight:400;line-height:22px}
.t-strong{font-size:17px;font-weight:600;line-height:22px}
.t-cap{font-size:13px;font-weight:500;line-height:18px;color:rgba(10,10,12,.6)}
:focus-visible{outline:2px solid #0A7CFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.press:active{transform:none}.opt,.seg{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #0A0A0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="position: absolute; inset: 0; transform: scale(.94) translateY(-10px); transform-origin: top center; border-radius: 40px; overflow: hidden">
    <dc-import name="Main" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; box-sizing: border-box; padding: 8px 16px 32px; border-radius: 36px 36px 0 0; background: #F2F2F7; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -8px 30px rgba(0,0,0,.12)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(10,10,12,.2)"></span>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <button type="button" class="t-body" style="justify-self: start; min-height: 44px; padding: 0; border: none; background: transparent; color: #0066CC">Annuler</button>
      <h1 id="sheet-title" class="t-strong" style="margin: 0">Pas dispo</h1>
      <span></span>
    </div>

    <div role="radiogroup" aria-labelledby="why-title" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="why-title" class="t-cap" style="margin: 0; padding: 0 16px">Qu'est-ce qui se passe ?</h2>
      <div style="background: #FFFFFF; border-radius: 16px; overflow: hidden">
        <sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
          <button type="button" role="radio" class="opt" aria-checked="{{r.aria}}" onClick="{{r.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border: none; background: {{r.bg}}; text-align: left; color: #0A0A0C">
            <span style="width: 32px; height: 32px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; background: #EDEDF0; color: #3A3A3F">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1; display: flex; flex-direction: column">
              <span class="t-body">{{r.label}}</span>
              <span class="t-cap">{{r.effect}}</span>
            </span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A7CFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{r.check}}"><path d="M5 12l5 5L20 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="dur-title" class="t-cap" style="margin: 0; padding: 0 16px">Combien de temps ?</h2>
      <div role="group" aria-labelledby="dur-title" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 22px; background: rgba(118,118,128,.14)">
        <button type="button" class="seg t-body" aria-pressed="true" style="min-height: 40px; border: none; border-radius: 18px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0,0,0,.12); font-weight: 600; color: #0A0A0C">Juste aujourd'hui</button>
        <button type="button" class="seg t-body" aria-pressed="false" style="min-height: 40px; border: none; border-radius: 18px; background: transparent; color: #0A0A0C">Jusqu'à…</button>
      </div>
    </div>

    <button type="button" class="press t-strong" style="margin-top: auto; min-height: 52px; border: none; border-radius: 26px; background: #0A7CFF; color: #FFFFFF">Continuer</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 3 };
  }
  renderVals() {
    const data = [
      { label: 'Pas le temps', effect: 'Reggie cherche un autre créneau', icon: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z' },
      { label: 'Fatiguée', effect: 'Repos aujourd’hui, la suite est allégée si besoin', icon: 'M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z' },
      { label: 'Malade', effect: 'Pause, puis reprise en douceur', icon: 'M9 3h6M12 3v4M8 7h8l1 14H7L8 7z' },
      { label: 'Douleur', effect: 'Deux questions, puis une séance adaptée', icon: 'M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z' },
      { label: 'Autre', effect: 'Explique à Reggie', icon: 'M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4.6A7.5 7.5 0 1 1 20 11.5z' }
    ];
    const cur = this.state.pick;
    return {
      reasons: data.map((d, i) => {
        const on = i === cur;
        return { label: d.label, effect: d.effect, icon: d.icon, aria: on ? 'true' : 'false', bg: on ? 'rgba(10,124,255,.08)' : 'transparent', check: on ? 1 : 0, pick: () => this.setState({ pick: i }) };
      })
    };
  }
}
</script>
</body>
</html>
