<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier une séance de muscu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0066CC;text-decoration:none}a:hover{color:#004C99}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
.t-body{font-size:17px;font-weight:400;line-height:22px}
.t-strong{font-size:17px;font-weight:600;line-height:22px}
.t-cap{font-size:13px;font-weight:500;line-height:18px;color:rgba(10,10,12,.6)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-left:16px;padding-right:16px}
.row + .row{border-top:.5px solid rgba(10,10,12,.1)}
.sw{position:relative;width:51px;height:31px;border:none;border-radius:16px;padding:0;flex:none;transition:background-color 200ms ease-out}
.sw span{position:absolute;top:2px;width:27px;height:27px;border-radius:14px;background:#FFFFFF;box-shadow:0 3px 8px rgba(0,0,0,.15),0 0 0 .5px rgba(0,0,0,.04);transition:left 200ms ease-out}
:focus-visible{outline:2px solid #0A7CFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.sw,.sw span{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #0A0A0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="position: absolute; inset: 0; transform: scale(.94) translateY(-10px); transform-origin: top center; border-radius: 40px; overflow: hidden">
    <dc-import name="Semaine" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; box-sizing: border-box; padding: 8px 16px 32px; border-radius: 36px 36px 0 0; background: #F2F2F7; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 -8px 30px rgba(0,0,0,.12)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(10,10,12,.2)"></span>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <button type="button" class="t-body" style="justify-self: start; min-height: 44px; padding: 0; border: none; background: transparent; color: #0066CC">Annuler</button>
      <h1 id="sheet-title" class="t-strong" style="margin: 0">Séance de muscu</h1>
      <button type="button" class="t-strong" style="justify-self: end; min-height: 44px; padding: 0; border: none; background: transparent; color: #0066CC">OK</button>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px">
      <div class="row">
        <label for="name" class="t-body">Nom</label>
        <input id="name" class="t-body" type="text" value="Jambes" style="flex: 1; min-width: 0; border: none; background: transparent; text-align: right; color: rgba(10,10,12,.6)">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="background: #FFFFFF; border-radius: 16px">
        <div class="row">
          <span id="legs-label" class="t-body">Travaille les jambes</span>
          <button type="button" class="sw" role="switch" aria-checked="{{legsAria}}" aria-labelledby="legs-label" onClick="{{toggleLegs}}" style="background: {{swBg}}"><span style="left: {{knob}}"></span></button>
        </div>
      </div>
      <p class="t-cap" style="margin: 0; padding: 0 16px">Reggie ne met pas de séance dure ni de sortie longue dans les 24 h qui suivent.</p>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <a href="#" class="row" style="color: #0A0A0C">
          <span class="t-body">{{f.label}}</span>
          <span style="display: flex; align-items: center; gap: 8px">
            <span class="t-body" style="color: rgba(10,10,12,.6)">{{f.value}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(10,10,12,.35)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
          </span>
        </a>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 16px">
      <button type="button" class="t-body" style="width: 100%; min-height: 52px; border: none; background: transparent; color: #D70015">Supprimer la séance</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { legs: true };
  }
  renderVals() {
    const on = this.state.legs;
    return {
      legsAria: on ? 'true' : 'false',
      swBg: on ? '#34C759' : 'rgba(120,120,128,.24)',
      knob: on ? '22px' : '2px',
      toggleLegs: () => this.setState({ legs: !on }),
      fields: [
        { label: 'Jour', value: 'Jeudi' },
        { label: 'Heure', value: '19:30' },
        { label: 'Durée', value: '1 h' },
        { label: 'Répéter', value: 'Chaque semaine' }
      ]
    };
  }
}
</script>
</body>
</html>
