<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Déplacer la séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0066CC;text-decoration:none}a:hover{color:#004C99}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.press{transition:transform 120ms ease-out}.press:active{transform:scale(.97)}
.opt{transition:box-shadow 180ms ease-out,background-color 180ms ease-out}
.t-body{font-size:17px;font-weight:400;line-height:22px}
.t-strong{font-size:17px;font-weight:600;line-height:22px}
.t-sub{font-size:15px;font-weight:400;line-height:20px;color:rgba(10,10,12,.6)}
.t-cap{font-size:13px;font-weight:500;line-height:18px;color:rgba(10,10,12,.6)}
:focus-visible{outline:2px solid #0A7CFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.press:active{transform:none}.opt{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #0A0A0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="position: absolute; inset: 0; transform: scale(.94) translateY(-10px); transform-origin: top center; border-radius: 40px; overflow: hidden">
    <dc-import name="Main" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 176px; box-sizing: border-box; padding: 8px 16px 32px; border-radius: 36px 36px 0 0; background: #F2F2F7; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -8px 30px rgba(0,0,0,.12)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(10,10,12,.2)"></span>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <button type="button" class="t-body" style="justify-self: start; min-height: 44px; padding: 0; border: none; background: transparent; color: #0066CC">Annuler</button>
      <h1 id="sheet-title" class="t-strong" style="margin: 0">Déplacer</h1>
      <span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #FFE6DA">
      <span style="width: 32px; height: 32px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; background: #FF6A2C; color: #FFFFFF">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4.5a1.5 1.5 0 1 0 0-.01M10 9l3-1 3 3 3 1M13 8l-2 5 3 3-1 5M11 13l-4 1-2 4"></path></svg>
      </span>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span class="t-strong" style="color: #7A2608">Fractionné · 50 min</span>
        <span class="t-cap" style="color: #B93A0A">Prévu ce soir à 18:00</span>
      </span>
    </div>

    <div role="radiogroup" aria-labelledby="slots-title" style="display: flex; flex-direction: column; gap: 8px">
      <h2 id="slots-title" class="t-cap" style="margin: 0; padding: 0 16px">Créneaux proposés</h2>
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
        <button type="button" role="radio" class="opt press" aria-checked="{{s.aria}}" onClick="{{s.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 16px; border: none; border-radius: 16px; background: #FFFFFF; box-shadow: {{s.ring}}; text-align: left; color: #0A0A0C">
          <span style="flex: 1; display: flex; flex-direction: column">
            <span class="t-strong">{{s.when}}</span>
            <span class="t-cap">{{s.why}}</span>
          </span>
          <span style="width: 24px; height: 24px; border-radius: 12px; flex: none; display: flex; align-items: center; justify-content: center; background: {{s.dot}}; box-shadow: {{s.dotRing}}; color: #FFFFFF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity: {{s.check}}"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
        </button>
      </sc-for>
    </div>

    <a href="#" class="t-body" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; color: #0A0A0C">
      Choisir un autre moment
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(10,10,12,.35)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <p class="t-cap" style="margin: 0; padding: 0 16px">{{consequence}}</p>

    <button type="button" class="press t-strong" style="margin-top: auto; min-height: 52px; border: none; border-radius: 26px; background: #0A7CFF; color: #FFFFFF">Déplacer à {{short}}</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 0 };
  }
  renderVals() {
    const data = [
      { when: 'Ce soir 19:30', short: 'ce soir 19:30', why: 'Même jour, une heure et demie plus tard', cons: 'Rien d’autre ne bouge dans ta semaine.' },
      { when: 'Mercredi 18:00', short: 'mercredi 18:00', why: 'Ta muscu jambes est jeudi soir, l’écart est bon', cons: 'Ton footing de mercredi matin passe à jeudi 7:30.' },
      { when: 'Jeudi 7:30', short: 'jeudi 7:30', why: 'Avant tes cours, au moins 12 h avant ta séance jambes', cons: 'Rien d’autre ne bouge dans ta semaine.' }
    ];
    const cur = this.state.pick;
    return {
      slots: data.map((d, i) => {
        const on = i === cur;
        return {
          when: d.when, why: d.why,
          aria: on ? 'true' : 'false',
          ring: on ? 'inset 0 0 0 2px #0A7CFF' : 'none',
          dot: on ? '#0A7CFF' : 'transparent',
          dotRing: on ? 'none' : 'inset 0 0 0 1.5px rgba(10,10,12,.25)',
          check: on ? 1 : 0,
          pick: () => this.setState({ pick: i })
        };
      }),
      consequence: data[cur].cons,
      short: data[cur].short
    };
  }
}
</script>
</body>
</html>
