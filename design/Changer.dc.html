<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Changer la séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0066CC;text-decoration:none}a:hover{color:#004C99}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font-family:inherit}
.press{transition:transform 120ms ease-out}.press:active{transform:scale(.97)}
.opt{transition:box-shadow 180ms ease-out}
.t-body{font-size:17px;font-weight:400;line-height:22px}
.t-strong{font-size:17px;font-weight:600;line-height:22px}
.t-cap{font-size:13px;font-weight:500;line-height:18px;color:rgba(10,10,12,.6)}
:focus-visible{outline:2px solid #0A7CFF;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.press:active{transform:none}.opt{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #0A0A0C; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums">
  <div aria-hidden="true" style="position: absolute; inset: 0; transform: scale(.94) translateY(-10px); transform-origin: top center; border-radius: 40px; overflow: hidden">
    <dc-import name="Main" hint-size="390px,844px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.32)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; box-sizing: border-box; padding: 8px 16px 32px; border-radius: 36px 36px 0 0; background: #F2F2F7; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -8px 30px rgba(0,0,0,.12)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: rgba(10,10,12,.2)"></span>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
      <button type="button" class="t-body" style="justify-self: start; min-height: 44px; padding: 0; border: none; background: transparent; color: #0066CC">Annuler</button>
      <h1 id="sheet-title" class="t-strong" style="margin: 0">Changer la séance</h1>
      <span></span>
    </div>

    <p class="t-cap" style="margin: 0; padding: 0 16px">Même moment, ce soir à 18:00. Prévu : fractionné 6 × 800 m, 50 min.</p>

    <div role="radiogroup" aria-label="Nouvelle séance" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
        <button type="button" role="radio" class="opt press" aria-checked="{{o.aria}}" onClick="{{o.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-height: 120px; padding: 16px; border: none; border-radius: 20px; background: #FFFFFF; box-shadow: {{o.ring}}; text-align: left; color: #0A0A0C">
          <span style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{o.tile}}; color: #FFFFFF">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
          </span>
          <span class="t-strong">{{o.title}}</span>
          <span class="t-cap">{{o.detail}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="why" class="t-cap" style="padding: 0 16px">Autre chose ? Dis-le à Reggie</label>
      <div style="display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 16px; border-radius: 26px; background: #FFFFFF">
        <input id="why" class="t-body" type="text" placeholder="Par exemple : je cours avec une amie" style="flex: 1; min-width: 0; border: none; background: transparent; color: #0A0A0C">
        <button type="button" class="press" aria-label="Envoyer à Reggie" style="width: 40px; height: 40px; flex: none; border: none; border-radius: 20px; background: rgba(10,124,255,.12); color: #0A7CFF; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
        </button>
      </div>
    </div>

    <button type="button" class="press t-strong" style="margin-top: auto; min-height: 52px; border: none; border-radius: 26px; background: #0A7CFF; color: #FFFFFF">Valider : {{chosen}}</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 0 };
  }
  renderVals() {
    const RUN = 'M13 4.5a1.5 1.5 0 1 0 0-.01M10 9l3-1 3 3 3 1M13 8l-2 5 3 3-1 5M11 13l-4 1-2 4';
    const data = [
      { title: 'Plus court', detail: '4 × 800 m à 4:55 · 38 min', tile: '#FF6A2C', icon: 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z' },
      { title: 'Plus facile', detail: '50 min, allure 6:15 à 6:45', tile: '#34B36A', icon: RUN },
      { title: 'Équivalente', detail: '3 × 1 600 m à 5:10 · 50 min', tile: '#FF6A2C', icon: 'M20 11a8 8 0 0 0-14.9-3M4 13a8 8 0 0 0 14.9 3M4 4v4h4M20 20v-4h-4' },
      { title: 'Footing tranquille', detail: '30 min, allure 6:30 à 7:00', tile: '#34B36A', icon: 'M4 18c4-8 12-8 16 0' }
    ];
    const cur = this.state.pick;
    return {
      opts: data.map((d, i) => {
        const on = i === cur;
        return { title: d.title, detail: d.detail, tile: d.tile, icon: d.icon, aria: on ? 'true' : 'false', ring: on ? 'inset 0 0 0 2px #0A7CFF' : 'none', pick: () => this.setState({ pick: i }) };
      }),
      chosen: data[cur].title.toLowerCase()
    };
  }
}
</script>
</body>
</html>
