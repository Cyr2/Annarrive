name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests with coverage thresholds
        run: pnpm test
      # Closed-loop bench of the training algorithm (about 4 s): fails when a score drops below eval/baseline.json.
      - name: Algorithm bench
        run: pnpm --filter @annarrive/coach eval
      - name: Build
        run: pnpm build
      - name: Lighthouse (mobile, every category at least 95)
        run: pnpm lighthouse
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      # The runner's speed explains most of the spread between two runs of the same code: logged next to each score.
      - name: Lighthouse runs (runner speed, score, TBT, LCP)
        if: always()
        run: >-
          node -e 'for (const f of require("fs").readdirSync(".lighthouseci").filter((f) => /^lhr-.*\.json$/.test(f))) {
          const r = require("./.lighthouseci/" + f), a = r.audits;
          console.log(`benchmarkIndex ${r.environment.benchmarkIndex}  performance ${r.categories.performance.score}
          TBT ${Math.round(a["total-blocking-time"].numericValue)} ms  LCP ${Math.round(a["largest-contentful-paint"].numericValue)} ms`) }'

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install WebKit (Safari on iPhone)
        run: pnpm --filter @annarrive/e2e exec playwright install --with-deps webkit
      - name: Playwright (iPhone 15, WebKit)
        run: pnpm --filter @annarrive/e2e e2e
      - name: Traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7

  bridge:
    name: garmin-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/garmin-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the app image
        run: docker build -t annarrive .
      - name: The app starts and answers its health check
        run: |
          docker run -d --name annarrive -p 8787:8787 -e SESSION_SECRET="$(openssl rand -hex 32)" annarrive
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then exit 0; fi
            sleep 1
          done
          docker logs annarrive
          exit 1
      - name: Build the bridge image
        run: docker build -t garmin-bridge apps/garmin-bridge
