name: Jumeau

# The twin (apps/server/twin): three simulated weeks of Anna's gestures on the real server, invariants checked at
# every step. Not a required check: random seeds still find known algorithm bugs (architecture.md, « Jumeau »).
on:
  schedule:
    - cron: "30 2 * * *"
  pull_request:
    paths:
      - "packages/coach/**"
      - "apps/server/src/services/**"
      - "apps/server/twin/**"
      - ".github/workflows/jumeau.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Graine à rejouer (vide : 10 graines au hasard)"
        required: false

concurrency:
  group: jumeau-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jumeau:
    name: jumeau
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the server
        run: pnpm --filter @annarrive/server build
      # A pull request replays seeds that pass on main, so a red run is a regression of that change.
      - name: Seeds 1, 2 and 5 (pull request)
        if: github.event_name == 'pull_request'
        run: |
          for seed in 1 2 5; do pnpm --filter @annarrive/server twin --seed "$seed" --budget 100; done
      # The night explores: 10 new seeds, every broken invariant listed, the first one reduced to its shortest sequence.
      - name: Ten random seeds (night)
        if: github.event_name != 'pull_request'
        env:
          SEED: ${{ inputs.seed }}
        run: |
          if [ -n "$SEED" ]; then which=(--seed "$SEED"); else which=(--seeds 10); fi
          pnpm --filter @annarrive/server twin "${which[@]}" --tout --budget 300
