[project]
name = "garmin-bridge"
version = "0.1.0"
description = "Service interne de Talaria : lit les données Garmin et envoie les séances sur la montre"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "garminconnect",
    "httpx",
]

[project.scripts]
garmin-bridge-login = "garmin_bridge.session:login_cli"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_bridge"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
