    <title>Annarrivé</title>
    <!--
      The launch animation (docs/interactions.md, Animations). Inline so it draws with the first frame, before any
      script; colours are literal because tokens.css is not loaded yet: keep them equal to the tokens (sky, white, the
      logo's coral and pink). Only transform and opacity move, so it runs on the compositor while the app starts.
    -->
    <style>
      #splash,
      #splash * {
        pointer-events: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        /* Above the tab bar, sheets and toasts. */
        z-index: 2147483647;
        background: linear-gradient(180deg, #fdede3 0%, #fdf1ea 18%, #fbf6f2 40%, #f9f6f3 100%);
        --w: min(60vw, 240px);
        /* If its script never runs, it still leaves. */
        animation: sp-fade 0.4s 2.4s forwards;
      }
      .sp-stage {
        position: absolute;
        inset: 0;
        animation: sp-shake 0.35s 0.5s ease-out;
      }
      .sp-bib,
      .sp-burst {
        position: absolute;
        left: calc(50% - var(--w) / 2);
        top: calc(44% - var(--w) * 0.36);
        width: var(--w);
        height: calc(var(--w) * 0.72);
      }
      .sp-bib {
        animation: sp-sprint 0.75s cubic-bezier(0.15, 1.25, 0.35, 1) both;
      }
      .sp-bib > * {
        position: absolute;
      }
      .sp-burst {
        left: calc(50% - var(--w) * 1.1);
        top: calc(44% - var(--w) * 1.1);
        width: calc(var(--w) * 2.2);
        height: calc(var(--w) * 2.2);
        border-radius: 50%;
        background: rgb(238 138 99 / 0.45);
        opacity: 0;
        animation: sp-burst 0.7s 0.55s ease-out forwards;
      }
      .sp-card {
        inset: 0;
        background: #fff;
        /* The logo's rx 18 on its 150 by 108 card. */
        border-radius: 12% / 16.667%;
        box-shadow: 0 16px 28px rgb(200 110 80 / 0.25);
        animation: sp-squash 0.75s cubic-bezier(0.15, 1.25, 0.35, 1) both;
      }
      .sp-pin {
        width: 6.667%;
        height: 9.259%;
        border-radius: 50%;
        background: #f5b3be;
        animation: sp-pop 0.25s cubic-bezier(0.2, 2, 0.4, 1) both;
      }
      .sp-svg {
        inset: 0;
        width: 100%;
        height: 100%;
        fill: #ee8a68;
      }
      .sp-num {
        /* The centre of the « 14 ». */
        transform-origin: 49.9% 46.4%;
        animation: sp-pop 0.4s 0.45s cubic-bezier(0.2, 1.8, 0.4, 1) both;
      }
      .sp-word {
        animation: sp-up 0.3s 0.8s ease-out both;
      }
      @keyframes sp-sprint {
        0% {
          transform: translateX(calc(-50vw - 100%)) skewX(18deg);
        }
        70% {
          transform: translateX(9%) skewX(-6deg);
        }
      }
      @keyframes sp-squash {
        0%,
        60% {
          transform: scale(1.15, 0.9);
        }
      }
      @keyframes sp-pop {
        0% {
          transform: scale(0);
        }
      }
      @keyframes sp-up {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes sp-burst {
        0% {
          transform: scale(0.03);
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes sp-shake {
        30% {
          transform: translateX(-4px);
        }
        60% {
          transform: translateX(3px);
        }
      }
      @keyframes sp-fade {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          display: none;
        }
      }
    </style>

    <script>
      (() => {
        const splash = document.getElementById("splash");
        const types = ["pointerdown", "keydown", "visibilitychange"];
        const end = () => {
          splash.remove();
          for (const type of types) document.removeEventListener(type, end, true);
        };
        let reloaded = false;
        try {
          // Set by « Recharger » (features/updates.ts): a new version, not a launch.
          reloaded = sessionStorage.getItem("splash-skip") === "1";
          sessionStorage.removeItem("splash-skip");
        } catch {}
        // Opened in the background (a reload while away) or with reduced motion: nothing plays.
        if (reloaded || document.visibilityState !== "visible" || matchMedia("(prefers-reduced-motion: reduce)").matches)
          return end();
        // A tap or a key ends it at once and still reaches what lies under it: the overlay takes no touch.
        for (const type of types) document.addEventListener(type, end, true);

        // The bib hands over to the first thing on Aujourd'hui, measured now: the moon on a rest day, else the card.
        const leave = () => {
          if (!splash.isConnected) return;
          const bib = splash.querySelector(".sp-bib");
          const main = location.pathname === "/" ? document.querySelector("#root main") : null;
          const target = main && (main.querySelector(".rest-moon") || main.querySelector("article"));
          const to = target && target.getBoundingClientRect();
          const from = bib.getBoundingClientRect();
          const moon = target && target.classList.contains("rest-moon");
          const timing = { duration: 500, easing: "cubic-bezier(.5,0,.2,1)", fill: "forwards" };
          if (to && to.width > 0 && to.top < innerHeight) {
            const dx = to.left + to.width / 2 - from.left - from.width / 2;
            const dy = to.top + to.height / 2 - from.top - from.height / 2;
            const transform = `translate(${dx}px, ${dy}px) scale(${to.width / from.width}, ${to.height / from.height})`;
            bib.animate({ transform, opacity: moon ? 1 : 0 }, timing);
            if (moon) {
              // The card rounds into the moon; what is printed on it fades.
              const [card, ...printed] = bib.children;
              card.animate({ borderRadius: "50%" }, { duration: 400, easing: "ease-in", fill: "forwards" });
              for (const part of printed) part.animate({ opacity: 0 }, { duration: 200, fill: "forwards" });
            }
          } else bib.animate({ transform: "scale(.9)", opacity: 0 }, timing);
          // The moon is seen landing before the sky clears; the card's handover is a cross-fade.
          const reveal = { duration: moon ? 250 : 400, delay: moon ? 400 : 250, easing: "ease-out", fill: "forwards" };
          splash.animate({ opacity: 0 }, reveal).onfinish = end;
        };
        // On the animation's own clock: the word lands last.
        splash.querySelector(".sp-word").addEventListener("animationend", () => setTimeout(leave, 250));
      })();
    </script>
